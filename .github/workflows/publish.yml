name: Publish scoreboard

on:
  # Refresh every day at 06:00 UTC (about 2am US Eastern).
  schedule:
    - cron: "0 6 * * *"
  # Also refresh whenever you change a file in the repo.
  push:
    branches: [main]
  # And lets you refresh on demand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch the latest table
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          GUARDIAN_KEY: ${{ secrets.GUARDIAN_KEY }}
        run: node update.js

      - name: Prepare Pages
        uses: actions/configure-pages@v5

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4

