<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Points League</title>
<meta name="description" content="A running Premier League points contest.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F0E6;
    --ink:#14261E;
    --muted:#7C8479;
    --line:#D9D6C7;
    --mine:#1E5AA8;
    --dads:#C0392B;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;line-height:1.5;
    padding:28px 18px 60px;
  }
  .wrap{max-width:760px;margin:0 auto}

  .eyebrow{
    font-family:"Barlow Condensed",Arial Narrow,sans-serif;
    text-transform:uppercase;letter-spacing:.14em;
    font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px;
  }
  h1{
    font-family:"Barlow Condensed",Arial Narrow,sans-serif;
    font-size:clamp(38px,10vw,62px);line-height:.95;
    font-weight:700;text-transform:uppercase;letter-spacing:-.01em;margin:0 0 6px;
  }
  .sub{color:var(--muted);font-size:14px;margin:0 0 30px}

  .board{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;margin-bottom:14px}
  .side{min-width:0}
  .side.right{text-align:right}
  .who{
    font-family:"Barlow Condensed",Arial Narrow,sans-serif;
    text-transform:uppercase;letter-spacing:.1em;font-size:14px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .who.mine{color:var(--mine)}
  .who.dads{color:var(--dads)}
  .tally{
    font-family:"Barlow Condensed",Arial Narrow,sans-serif;
    font-size:clamp(58px,17vw,104px);line-height:.82;
    font-weight:700;font-variant-numeric:tabular-nums;
  }
  .dash{
    font-family:"Barlow Condensed",Arial Narrow,sans-serif;
    font-size:clamp(28px,7vw,48px);color:var(--line);
    padding-bottom:.18em;font-weight:700;
  }

  .tug{height:14px;display:flex;overflow:hidden;border:1px solid var(--ink);background:var(--paper)}
  .tug span{transition:width .45s ease}
  .tug .a{background:var(--mine)}
  .tug .b{background:var(--dads)}
  .lead{
    font-family:"Barlow Condensed",Arial Narrow,sans-serif;
    text-transform:uppercase;letter-spacing:.1em;font-weight:600;
    font-size:13px;color:var(--muted);margin:8px 0 38px;text-align:center;
  }

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  @media (max-width:620px){.cols{grid-template-columns:1fr;gap:34px}}

  .colhead{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    border-bottom:2px solid var(--ink);padding-bottom:5px;
  }
  .colhead .name{
    font-family:"Barlow Condensed",Arial Narrow,sans-serif;
    text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:16px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .colhead .pts{
    font-family:"Barlow Condensed",Arial Narrow,sans-serif;
    font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  table{width:100%;border-collapse:collapse}
  th{
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);font-weight:500;padding:7px 0 3px;text-align:center;
  }
  th:first-child{text-align:left}
  td{padding:7px 0;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
  td:first-child{text-align:left;font-weight:500}
  td.pts{font-weight:600}
  .col-narrow{width:34px}
  .missing{color:var(--muted);font-style:italic}

  /* ---- matchweek recaps ---- */
  .recapwrap{margin-top:46px}
  .secthead{
    font-family:"Barlow Condensed",Arial Narrow,sans-serif;
    text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:16px;
    margin:0 0 2px;border-bottom:2px solid var(--ink);padding-bottom:5px;
  }
  .sectnote{color:var(--muted);font-size:13px;margin:8px 0 18px}
  .recap{
    border-left:3px solid var(--line);
    padding:12px 0 12px 14px;margin-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .recap.mine{border-left-color:var(--mine)}
  .recap.dads{border-left-color:var(--dads)}
  .recap-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:5px}
  .recap-club{
    font-family:"Barlow Condensed",Arial Narrow,sans-serif;
    text-transform:uppercase;letter-spacing:.09em;font-weight:700;font-size:15px;
  }
  .recap.mine .recap-club{color:var(--mine)}
  .recap.dads .recap-club{color:var(--dads)}
  .recap-fixture{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .recap-pts{
    margin-left:auto;font-family:"Barlow Condensed",Arial Narrow,sans-serif;
    font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;color:var(--muted);
  }
  .recap-text{margin:0;font-size:14.5px;line-height:1.55}
  .recap-link{
    display:inline-block;margin-top:7px;font-size:13px;
    color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);
  }
  .recap-link:hover,.recap-link:focus{border-bottom-color:var(--ink)}
  .recap-link:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  footer{margin-top:42px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
  footer b{color:var(--ink);font-weight:600}
  .note{margin-top:8px}
  .status{padding:20px 0;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <p class="eyebrow" id="eyebrow">Premier League</p>
  <h1>Points League</h1>
  <p class="sub">Three for a win, one for a draw. Every match counts, against anyone.</p>

  <div id="scoreboard" hidden>
    <div class="board">
      <div class="side">
        <div class="who mine" id="mineName">&nbsp;</div>
        <div class="tally" id="mineTotal">0</div>
      </div>
      <div class="dash">&mdash;</div>
      <div class="side right">
        <div class="who dads" id="dadsName">&nbsp;</div>
        <div class="tally" id="dadsTotal">0</div>
      </div>
    </div>

    <div class="tug" aria-hidden="true">
      <span class="a" id="tugA" style="width:50%"></span>
      <span class="b" id="tugB" style="width:50%"></span>
    </div>
    <p class="lead" id="leadNote">Level</p>

    <div class="cols">
      <section>
        <div class="colhead">
          <span class="name" id="mineLabel" style="color:var(--mine)">&nbsp;</span>
          <span class="pts" id="mineHeadPts">0 pts</span>
        </div>
        <table>
          <thead>
            <tr><th>Club</th><th class="col-narrow">P</th><th class="col-narrow">W</th><th class="col-narrow">D</th><th class="col-narrow">Pts</th></tr>
          </thead>
          <tbody id="mineRows"></tbody>
        </table>
      </section>

      <section>
        <div class="colhead">
          <span class="name" id="dadsLabel" style="color:var(--dads)">&nbsp;</span>
          <span class="pts" id="dadsHeadPts">0 pts</span>
        </div>
        <table>
          <thead>
            <tr><th>Club</th><th class="col-narrow">P</th><th class="col-narrow">W</th><th class="col-narrow">D</th><th class="col-narrow">Pts</th></tr>
          </thead>
          <tbody id="dadsRows"></tbody>
        </table>
      </section>
    </div>

    <section class="recapwrap" id="recapWrap" hidden>
      <h2 class="secthead" id="recapHead">The last matchweek</h2>
      <p class="sectnote" id="recapNote">&nbsp;</p>
      <div id="recapList"></div>
    </section>

    <footer>
      Updated <b id="updated">&mdash;</b>. Refreshes every morning.
      <div class="note" id="warnings"></div>
    </footer>
  </div>

  <p class="status" id="status">Loading the table&hellip;</p>
</div>

<script>
var statusEl = document.getElementById("status");

function text(id, value){
  document.getElementById(id).textContent = value;
}

fetch("standings.json?t=" + Date.now())
  .then(function(r){
    if (!r.ok) throw new Error("standings.json is missing");
    return r.json();
  })
  .then(render)
  .catch(function(err){
    statusEl.textContent =
      "Couldn't load the table (" + err.message + "). Try again in a minute, " +
      "or run the Publish scoreboard job from the Actions tab.";
  });

function render(data){
  var fmt = new Intl.DateTimeFormat(undefined, {
    weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit"
  });

  text("eyebrow",
    "Premier League" + (data.season ? " " + data.season : "") +
    (data.matchday ? " \u00B7 Matchweek " + data.matchday : ""));

  ["mine","dads"].forEach(function(key){
    var side = data.sides[key];
    var body = document.getElementById(key + "Rows");
    body.innerHTML = "";

    side.teams.forEach(function(team){
      var tr = document.createElement("tr");
      var missing = team.inLeague === false;
      var cells = missing ? ["\u2014","\u2014","\u2014","0"]
                          : [team.played, team.won, team.drawn, team.points];

      var nameCell = document.createElement("td");
      nameCell.textContent = team.club;
      if (missing) nameCell.className = "missing";
      tr.appendChild(nameCell);

      cells.slice(0,3).forEach(function(v){
        var td = document.createElement("td");
        td.textContent = v;
        tr.appendChild(td);
      });

      var ptsCell = document.createElement("td");
      ptsCell.className = "pts";
      ptsCell.textContent = cells[3];
      tr.appendChild(ptsCell);

      body.appendChild(tr);
    });

    text(key + "Name", side.name || "");
    text(key + "Label", side.label || "");
    text(key + "Total", side.total);
    text(key + "HeadPts", side.total + " pts");
  });

  var mine = data.sides.mine.total;
  var dads = data.sides.dads.total;
  var grand = mine + dads;
  var share = grand === 0 ? 50 : (mine / grand) * 100;
  document.getElementById("tugA").style.width = share + "%";
  document.getElementById("tugB").style.width = (100 - share) + "%";

  var gap = Math.abs(mine - dads);
  var leader = mine > dads ? data.sides.mine.name : data.sides.dads.name;
  text("leadNote", gap === 0
    ? "Level"
    : leader + " ahead by " + gap + (gap === 1 ? " point" : " points"));

  renderRecap(data.recap);

  text("updated", data.updated ? fmt.format(new Date(data.updated)) : "unknown");

  if (data.warnings && data.warnings.length) {
    text("warnings", data.warnings.join(" \u00B7 "));
  }

  statusEl.hidden = true;
  document.getElementById("scoreboard").hidden = false;
}

function renderRecap(recap){
  if (!recap || !recap.entries || !recap.entries.length) return;

  var dayFmt = new Intl.DateTimeFormat(undefined, { weekday:"short", day:"numeric", month:"short" });
  var list = document.getElementById("recapList");
  list.innerHTML = "";

  text("recapHead", "Matchweek " + recap.matchday);
  text("recapNote", "What happened to the ten clubs. "
    + (recap.hasReports ? "Follow a link for the full match report."
                        : "Result summaries only."));

  recap.entries.forEach(function(e){
    var art = document.createElement("article");
    art.className = "recap " + e.side;

    var top = document.createElement("div");
    top.className = "recap-top";

    var club = document.createElement("span");
    club.className = "recap-club";
    club.textContent = e.club;
    top.appendChild(club);

    var fix = document.createElement("span");
    fix.className = "recap-fixture";
    fix.textContent = e.fixture + " \u00B7 " + dayFmt.format(new Date(e.date));
    top.appendChild(fix);

    var pts = document.createElement("span");
    pts.className = "recap-pts";
    pts.textContent = "+" + e.points;
    top.appendChild(pts);

    art.appendChild(top);

    var p = document.createElement("p");
    p.className = "recap-text";
    p.textContent = e.summary;
    art.appendChild(p);

    if (e.reportUrl) {
      var a = document.createElement("a");
      a.className = "recap-link";
      a.href = e.reportUrl;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Match report \u2192";
      art.appendChild(a);
    }

    list.appendChild(art);
  });

  document.getElementById("recapWrap").hidden = false;
}
</script>
</body>
</html>
